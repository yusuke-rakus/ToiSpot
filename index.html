<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // ReactとCSSの読み込み前に適用し、初回表示のちらつきを防ぐ。
      ;(() => {
        let theme = 'system'
        try {
          const saved = localStorage.getItem('toilet-map-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch {
          // 保存を許可しない環境ではシステム設定を使う。
        }
        const dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta
      name="description"
      content="コンビニのトイレの利用条件や設備を調べるマップ。"
    />
    <title>コンビニトイレマップ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
